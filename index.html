<script>

{n:'Coinbase BTC-USD',u:'wss://ws-feed.exchange.coinbase.com',sub:{type:'subscribe',product_ids:['BTC-USD'],channels:['ticker']},p:m=>m.type==='ticker'&&m.price?{p:+m.price,t:Date.parse(m.time)||0}:null}];

function openWS(){
 dropWS();clearTimeout(rt);const s=SRC[si];setSt('btc','CONNECTING','connecting to '+s.n);openedAt=Date.now();
 let w;try{w=new WebSocket(s.u)}catch(e){return retryWS()}

 w.onopen=()=>{if(s.sub)w.send(JSON.stringify(s.sub))};
 w.onerror=()=>{};w.onclose=()=>{if(ws===w){clearTimeout(guard);retryWS()}};

 if(ws&&lastTick&&Date.now()-lastTick<5000)setSt('btc','LIVE',SRC[si].n+' · '+((Date.now()-lastTick)/1000).toFixed(1)+'s ago');
 else if(ws&&lastTick&&age<12000)setSt('btc','STALE',SRC[si].n+' · no tick '+(age/1000|0)+'s');
 else if(ws&&age>=12000)retryWS()}
/* ---------- round discovery (Gamma) ---------- */
let R=null,book={up:null,dn:null,t:0},bookErr='',bookBusy=0,ptbBusy=0,loading=0,nextLoad=0,loadFails=0,H=[],dirty=0,lastSave=0;
let storeWarn='';
const sane=r=>r&&typeof r==='object'&&typeof r.slug==='string'&&/^btc-updown-5m-\d+$/.test(r.slug)&&+r.slug.slice(14)===r.start&&r.end===r.start+300&&r.ptb>0&&['UP','DOWN','SKIP'].includes(r.orig)&&['UP','DOWN','SKIP'].includes(r.final)&&Array.isArray(r.ch);
function loadH(){let raw=null,a=[];
 try{raw=localStorage.getItem('vvs_h')}catch(e){storeWarn='Browser storage unavailable: history will NOT persist.';return[]}
 if(!raw)return[];
 try{a=JSON.parse(raw);if(!Array.isArray(a))throw 0}catch(e){try{localStorage.setItem('vvs_h_corrupt',raw)}catch(e2){}storeWarn='Stored history was unreadable; a raw copy was kept (vvs_h_corrupt).';return[]}
 const m=new Map(),rej=[];
 for(const r of a){if(!sane(r)){rej.push(r);continue}const o=m.get(r.slug);
  if(!o)m.set(r.slug,r);else{const keep=r.t0<o.t0?r:o,drop=keep===r?o:r;if(drop.res&&!keep.res){keep.res=drop.res;keep.rs=drop.rs}rej.push(drop);m.set(r.slug,keep)}}
 const out=[...m.values()].map(r=>{r.id=r.id||r.slug+'#orig';if(r.res&&!r.ver)r.ver='VERIFIED · Polymarket resolution';return r}).sort((x,y)=>x.start-y.start);
 if(rej.length){try{const p=JSON.parse(localStorage.getItem('vvs_h_rejected')||'[]');localStorage.setItem('vvs_h_rejected',JSON.stringify(p.concat(rej)))}catch(e){}storeWarn=rej.length+' stored record(s) were duplicate/invalid and are excluded from statistics (raw copies kept).';dirty=1}
 return out}
H=loadH();
function save(){dirty=1}
function flush(){if(dirty&&Date.now()-lastSave>4000){dirty=0;lastSave=Date.now();try{localStorage.setItem('vvs_h',JSON.stringify(H));if(storeWarn.startsWith('Could not'))storeWarn=''}catch(e){storeWarn='Could not save history (storage full or blocked). New records may be lost on reload.';dirty=1}}}
async function loadRound(){
 loading=1;const st=Math.floor(now()/1000/W)*W,slug='btc-updown-5m-'+st;
 try{const a=await jf(`${G}/events?slug=${slug}`),ev=Array.isArray(a)?a[0]:a;
  if(!ev||!ev.markets||!ev.markets[0])throw new Error('market not listed yet');
  const m=ev.markets[0],ids=pj(m.clobTokenIds),oc=pj(m.outcomes),iu=oc.findIndex(o=>/^up$/i.test(o)),id=oc.findIndex(o=>/^down$/i.test(o));
  if(iu<0||id<0||!ids[iu]||!ids[id])throw new Error('Up/Down token IDs not found');
  const ed=Date.parse(ev.endDate||m.endDate||''),warn=ed&&Math.abs(ed/1000-(st+W))>15?'end time differs from slug':'';
  if(Math.floor(now()/1000/W)*W!==st)throw new Error('round changed while loading');
  R={slug,start:st,end:st+W,up:ids[iu],dn:ids[id],cond:m.conditionId||'',title:ev.title||slug,liq:+(m.liquidityNum||m.liquidity||ev.liquidity)||null,warn,ptb:null,nextPtb:0,pTries:0,ptbErr:'',rec:null};
  book={up:null,dn:null,t:0};bookErr='';resetE();loadFails=0;setSt('pm','CONNECTING','loading order books');setSt('ptb','CONNECTING','requesting open price');pollBook();pollPTB()
 }catch(e){loadFails++;setSt('pm','DISCONNECTED','market discovery: '+ename(e));nextLoad=Date.now()+Math.min(1500*loadFails,10000)}
 loading=0}
function rollover(){if(R&&now()/1000>=R.end){R=null;resetE();book={up:null,dn:null,t:0}}}
/* ---------- CLOB books ---------- */
function pb(b){const bi=(b.bids||[]).map(x=>[+x.price,+x.size]).filter(x=>x[1]>0).sort((a,c)=>c[0]-a[0]),as=(b.asks||[]).map(x=>[+x.price,+x.size]).filter(x=>x[1]>0).sort((a,c)=>a[0]-c[0]);
 const d=a=>a.slice(0,5).reduce((s,x)=>s+x[0]*x[1],0),bid=bi[0]?bi[0][0]:null,ask=as[0]?as[0][0]:null;
 return{bid,ask,bs:bi[0]?bi[0][1]:0,as:as[0]?as[0][1]:0,last:+b.last_trade_price||null,mid:bid!=null&&ask!=null?(bid+ask)/2:null,spread:bid!=null&&ask!=null?ask-bid:null,bd:d(bi),ad:d(as)}}
async function pollBook(){const r=R;if(!r||bookBusy)return;bookBusy=1;
 try{const [u,d]=await Promise.all([jf(`${C}/book?token_id=${r.up}`,5000),jf(`${C}/book?token_id=${r.dn}`,5000)]);if(R===r){book={up:pb(u),dn:pb(d),t:Date.now()};bookErr=''}}
 catch(e){bookErr=ename(e)}bookBusy=0}
/* ---------- Price to Beat ---------- */
async function pollPTB(){const r=R;if(!r||r.ptb||ptbBusy||Date.now()<r.nextPtb)return;ptbBusy=1;const iso=s=>new Date(s*1000).toISOString().replace('.000','');

  try{const j=await jf(`https://polymarket.com/api/crypto/crypto-price?symbol=BTC&eventStartTime=${iso(r.start)}&variant=fiveminute&endDate=${iso(r.end)}`);
   if(j&&typeof j.openPrice==='number'&&j.openPrice>0){v=j.openPrice;src='Polymarket crypto-price (Chainlink open)'}else throw new Error('openPrice not published yet')}
  catch(e1){r.ptbErr='crypto-price: '+ename(e1);const a=await jf(`${G}/events?slug=${r.slug}`),md=a[0]&&a[0].eventMetadata,p=md&&+md.priceToBeat;if(p>0){v=p;src='Polymarket Gamma eventMetadata'}else r.ptbErr+='; Gamma has no priceToBeat'}

const E={cur:null,cand:null,cnt:0,last:null,hcN:0,miss:null,why:''};
function resetE(){E.cur=E.cand=null;E.cnt=0;E.last=null;E.hcN=0;E.miss=null;E.why=''}
const at=s=>{const t=now()-s*1000;for(let i=ticks.length-1;i>=0;i--)if(ticks[i][0]<=t)return ticks[i][1];return null};

 if(!R.ptb||R.ptb.slug!==R.slug)return;

  if(ex){R.rec=ex;ad=1;from=ex.final}
  else{R.rec={id:R.slug+'#orig',slug:R.slug,cond:R.cond,start:R.start,end:R.end,ptb:R.ptb.v,ps:R.ptb.src,px0:btc,orig:to,final:to,ch:[],t0:Date.now(),lag:Math.round(now()/1000-R.start),pu:L?L.pUp:null,cf:L?L.conf:null,odds:L&&L.pm?L.pmUp:null,ver:'target: '+R.ptb.src,hc:null,res:null};H.push(R.rec)}}

function step(raw,sc,why,L,hard){

function evalEngine(){
 const T=R?R.end-now()/1000:0,miss=[];
 if(ST.btc.s!=='LIVE')miss.push('BTC feed '+ST.btc.s);
 if(!R)miss.push('active market');else if(!R.ptb||R.ptb.slug!==R.slug)miss.push('verified Price to Beat');

 if(miss.length){setSt('eng','DISABLED','missing: '+miss.join(', '));E.last=null;if(E.cur&&R)step('SKIP',0,'inputs unavailable: '+miss.join(', '),null,true);return}
 setSt('eng','LIVE','scoring model · estimates');
 const p=btc,dist=p-R.ptb.v,p10=at(10),p30=at(30),p60=at(60);
 const s10=(p-p10)/10,s30=p30!=null?(p-p30)/30:s10,s60=p60!=null?(p-p60)/60:s30,bl=.5*s10+.3*s30+.2*s60;
 let ss=0,n=0,agr=0,nz=0;for(let i=0;i<60;i++){const a=at(i),b=at(i+1);if(a!=null&&b!=null){ss+=(a-b)**2;n++;if(i<30&&a!==b){nz++;if(Math.sign(a-b)===Math.sign(bl))agr++}}}
 const sg=Math.max(Math.sqrt(ss/Math.max(n,1)),p*5e-6),sr=sg*Math.sqrt(Math.max(T,1)),zpos=dist/sr;
